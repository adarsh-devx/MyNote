[package]
name = "mynotes"
version = "0.1.0"
description = "MyNotes - Keep your thoughts. Keep your tasks."
authors = ["MyNotes"]
edition = "2021"

[lib]
name = "mynotes_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
# Official Tauri WinRT toast wrapper — the same crate tauri-plugin-notification
# uses on Windows (through notify-rust). Used directly so the toast can be
# created with its WinRT Activated (click) handler attached, which the
# notification plugin's desktop API does not expose.
tauri-winrt-notification = "0.7"

