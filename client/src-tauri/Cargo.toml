[package]
name = "mynotes"
version = "0.1.0"
description = "MyNotes - Keep your thoughts. Keep your tasks."
authors = ["MyNotes"]
edition = "2021"

[lib]
name = "mynotes_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
